<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔒 Base Styling -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: white;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* ❌ Hide floating button */
        #tidio-chat-button,
        .tidio-chat-button {
            display: none !important;
        }

        /* 🔒 Hide initially */
        iframe[src*="tidio"],
        #tidio-chat,
        .tidio-chat {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* ✅ Force fullscreen chat */
        iframe[src*="tidio"] {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            z-index: 999999 !important;
        }
    </style>

    <!-- ✅ Tidio Script -->
    <script src="https://code.tidio.co/na5y0weklpcd9uxhccfezplsfg0fggvk.js"></script>
</head>

<body>

<script>
    document.addEventListener("tidioChat-ready", function () {

        if (!window.tidioChatApi) return;

        // 👤 Set user data (replace dynamically if needed)
        window.tidioChatApi.setVisitorData({
            name: "Nidhi Chauhan",
            email: "nidhi@email.com",
            distinct_id: "seller_nidhi@email.com",
            role: "seller"
        });

        // 🔥 Function to always open chat
        function openChatAlways() {
            window.tidioChatApi.show();
            window.tidioChatApi.open();
        }

         setTimeout(openChat, 100);


        // 👁 Show widget again after hidden
        const style = document.createElement('style');
        style.innerHTML = `
            iframe[src*="tidio"],
            #tidio-chat,
            .tidio-chat {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
            }
        `;
        document.head.appendChild(style);

        // 🚀 First open
        setTimeout(openChatAlways, 100);

        // 🔁 Prevent going back to launcher/home
        window.tidioChatApi.on("close", function () {
          if (window.AndroidInterface) {
            window.AndroidInterface.onChatClosed();
        }
            setTimeout(openChatAlways, 100);
        });

    });
</script>

</body>
</html>
